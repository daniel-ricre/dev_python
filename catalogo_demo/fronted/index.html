<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - Mipime Cubana</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>🌿 Productos de la Mipime</h1>
        <p>Hecho a mano, con amor y talento cubano</p>
        <button id="btn-admin" class="btn-admin">🔧 Administrar</button>
    </header>

    <!-- Filtro por categoría (visible siempre) -->
    <nav id="filtros-nav">
        <button class="filtro-btn activo" data-categoria="todas">Todas</button>
        <!-- Las categorías se llenarán dinámicamente -->
    </nav>

    <!-- Panel de administración (oculto por defecto) -->
    <section id="admin-panel" class="admin-panel" style="display: none;">
        <h2>Agregar nuevo producto</h2>
        <form id="form-producto" class="form-producto">
            <div class="campo">
                <label for="nombre">Nombre*</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="campo">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="3"></textarea>
            </div>
            <div class="campo">
                <label for="precio">Precio*</label>
                <input type="number" id="precio" name="precio" step="0.01" min="0" required>
            </div>
            <div class="campo">
                <label for="categoria">Categoría</label>
                <input type="text" id="categoria" name="categoria" placeholder="Ej: Mochilas">
            </div>
            <div class="campo">
                <label for="imagen">Imagen (ruta)</label>
                <input type="text" id="imagen" name="imagen" placeholder="img/mochila.jpg">
            </div>
            <button type="submit" class="btn-agregar">➕ Agregar producto</button>
        </form>
        <div id="mensaje-admin" class="mensaje"></div>
    </section>

    <!-- Contenedor de productos -->
    <main id="contenedor-productos" class="grid-productos">
        <!-- Se llena con JavaScript -->
    </main>

    <div id="sin-resultados" class="sin-resultados" style="display: none;">
        <p>No se encontraron productos en esta categoría.</p>
    </div>

    <footer>
        <p>&copy; 2025 Mipime Cubana - Contacto: +53 5XXXXXXX</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
