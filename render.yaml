services:
  - type: web
    runtime: docker
    name: art-backend
    rootDir: Arte_Tienda_Cripto_Marketplace/art_marketplace/backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: art-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: art-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false
      - key: ONG_PUBLIC_KEY
        sync: false
      - key: ONG_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: POSTAL_SMTP_HOST
        sync: false
      - key: POSTAL_SMTP_PORT
        sync: false
      - key: POSTAL_SMTP_USER
        sync: false
      - key: POSTAL_SMTP_PASS
        sync: false

  - type: web
    runtime: docker
    name: art-frontend
    rootDir: Arte_Tienda_Cripto_Marketplace/art_marketplace/frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_ESCROW_CONTRACT
        sync: false
      - key: VITE_USDC_ADDRESS
        sync: false

  - type: web
    runtime: docker
    name: art-postal
    rootDir: Arte_Tienda_Cripto_Marketplace/art_marketplace/postal
    plan: free
    healthCheckPath: /
    envVars:
      - key: POSTAL_DB_HOST
        fromDatabase:
          name: art-db
          property: host
      - key: POSTAL_DB_PORT
        fromDatabase:
          name: art-db
          property: port
      - key: POSTAL_DB_USER
        fromDatabase:
          name: art-db
          property: user
      - key: POSTAL_DB_PASS
        fromDatabase:
          name: art-db
          property: password
      - key: POSTAL_DB_NAME
        value: postal_db

databases:
  - name: art-db
    plan: free
  - name: art-redis
    plan: free
