# render.yaml
services:
  # 1. Backend: API de FastAPI
  - type: web
    runtime: docker
    name: art-backend
    repo: https://github.com/tu-usuario/tu-repositorio # Cambia por tu repo
    rootDir: backend
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: art-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: art-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: static
          name: art-frontend
          property: url
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false
      - key: ONG_PUBLIC_KEY
        sync: false
      - key: ONG_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # 2. Worker: Monitor de Blockchain (Celery Beat)
  - type: worker
    runtime: docker
    name: art-worker
    repo: https://github.com/tu-usuario/tu-repositorio
    rootDir: backend
    dockerCommand: celery -A app.celery_app beat --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: art-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: art-redis
          property: connectionString
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false

  # 3. Worker Celery (ejecutor de tareas)
  - type: worker
    runtime: docker
    name: art-celery
    repo: https://github.com/tu-usuario/tu-repositorio
    rootDir: backend
    dockerCommand: celery -A app.tasks.blockchain_monitor worker --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: art-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: art-redis
          property: connectionString
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false

  # 4. Frontend: Aplicación React
  - type: static
    runtime: docker
    name: art-frontend
    repo: https://github.com/tu-usuario/tu-repositorio
    rootDir: frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: art-backend
          property: url
      - key: VITE_ESCROW_CONTRACT
        sync: false
      - key: VITE_USDC_ADDRESS
        sync: false

# Bases de datos gestionadas
databases:
  - name: art-db
    plan: free
  - name: art-redis
    plan: free
