services:
  # 1. Backend: API de FastAPI (Python nativo)
  - type: web
    runtime: python
    name: art-backend
    rootDir: Arte_Tienda_Cripto_Marketplace/art_marketplace/backend
    plan: free
    healthCheckPath: /docs
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: art-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: art-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false
      - key: ONG_PUBLIC_KEY
        sync: false
      - key: ONG_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # 2. Worker: Monitor de Blockchain (Celery Beat)
  - type: worker
    runtime: python
    name: art-worker
    rootDir: Arte_Tienda_Cripto_Marketplace/art_marketplace/backend
    startCommand: celery -A app.celery_app beat --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: art-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: art-redis
          property: connectionString
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false

  # 3. Worker Celery (ejecutor de tareas)
  - type: worker
    runtime: python
    name: art-celery
    rootDir: Arte_Tienda_Cripto_Marketplace/art_marketplace/backend
    startCommand: celery -A app.tasks.blockchain_monitor worker --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: art-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: art-redis
          property: connectionString
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false

  # 4. Frontend: Aplicación React (sitio estático)
  - type: static
    name: art-frontend
    rootDir: Arte_Tienda_Cripto_Marketplace/art_marketplace/frontend
    plan: free
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_ESCROW_CONTRACT
        sync: false
      - key: VITE_USDC_ADDRESS
        sync: false

databases:
  - name: art-db
    plan: free
  - name: art-redis
    plan: free
