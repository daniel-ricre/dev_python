services:
  - type: web
    runtime: docker
    name: art-backend
    rootDir: Arte_Tienda_Cripto_Marketplace/art_marketplace/backend
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: art-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: art-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false
      - key: ONG_PUBLIC_KEY
        sync: false
      - key: ONG_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    runtime: docker
    name: art-frontend
    rootDir: Arte_Tienda_Cripto_Marketplace/art_marketplace/frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_ESCROW_CONTRACT
        sync: false
      - key: VITE_USDC_ADDRESS
        sync: false

  - type: web
    runtime: docker
    name: art-x402-facilitator
    rootDir: Arte_Tienda_Cripto_Marketplace/art_marketplace/x402-facilitator
    plan: free
    healthCheckPath: /health
    envVars:
      - key: X402_WALLET_ADDRESS
        sync: false
      - key: X402_RPC_URL
        sync: false
      - key: X402_USDC_CONTRACT
        sync: false

databases:
  - name: art-db
    plan: free
  - name: art-redis
    plan: free
