version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: art_marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/art_marketplace
      - REDIS_URL=redis://redis:6379/0
      - ARBITRUM_RPC_URL=${ARBITRUM_RPC_URL}
      - ESCROW_CONTRACT_ADDRESS=${ESCROW_CONTRACT_ADDRESS}
      - ONG_PUBLIC_KEY=${ONG_PUBLIC_KEY}
      - ONG_PRIVATE_KEY=${ONG_PRIVATE_KEY}
      - USDC_ADDRESS=0xaf88d065e77c8cC2239327C5EDb3A432268e5831
      - SECRET_KEY=${SECRET_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./blockchain:/blockchain
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-beat:
    build: ./backend
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      - redis
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg2://user:password@db:5432/art_marketplace
      - REDIS_URL=redis://redis:6379/0
      - ARBITRUM_RPC_URL=${ARBITRUM_RPC_URL}
      - ESCROW_CONTRACT_ADDRESS=${ESCROW_CONTRACT_ADDRESS}
    volumes:
      - ./backend:/app
      - ./blockchain:/blockchain

  celery-worker:
    build: ./backend
    command: celery -A app.tasks.blockchain_monitor worker --loglevel=info
    depends_on:
      - redis
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg2://user:password@db:5432/art_marketplace
      - REDIS_URL=redis://redis:6379/0
      - ARBITRUM_RPC_URL=${ARBITRUM_RPC_URL}
      - ESCROW_CONTRACT_ADDRESS=${ESCROW_CONTRACT_ADDRESS}
    volumes:
      - ./backend:/app
      - ./blockchain:/blockchain

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_ESCROW_CONTRACT=${ESCROW_CONTRACT_ADDRESS}
      - VITE_USDC_ADDRESS=0xaf88d065e77c8cC2239327C5EDb3A432268e5831
    depends_on:
      - backend